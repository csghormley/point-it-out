[project]
name = "mapsurvey"
license = "MIT"
version = "0.1.0"
description = "Django-based spatial data entry platform for collecting and visualizing geographic point data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wheel",
    "Django>=6.0.2,<7",
    "django-environ",
    "GEOS",
    "PROJ",
    "django-geojson",
    # Platform-specific psycopg variants
    "psycopg[binary]>=3.0 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "psycopg>=3.0 ; sys_platform == 'linux'",
    # Platform-specific GDAL versions
    "GDAL==3.11.4 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "GDAL==3.8.4 ; sys_platform == 'linux'",
    # Two-factor authentication
    "phonenumbers",
    "webauthn",
    "django-formtools",
    "cffi",
    # Debug toolbar
    "django-debug-toolbar",
    # Security
    "django-csp>=4.0",
    "django-allauth[mfa]",
    # Django extensions and REST framework
    "django-extensions",
    "djangorestframework",
    "djangorestframework-gis==1.2.0",
    "django-leaflet",
    "markdown",
    "django-filter",
    # Production server
    "gunicorn",
    # Additional utilities
    "tzdata",
    "geoip2",
    "django-json-widget",
    # Segmentation dependencies
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[dependency-groups]
dev = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W291"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/migrations/*.py" = ["E501"]
