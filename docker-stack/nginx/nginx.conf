upstream mapsurvey {
    server django:8000;
}

# Define rate limit zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/m;

server {

    listen 8888;

    location / {

        proxy_pass http://mapsurvey/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        # set a general request limit overridden below
        limit_req zone=general burst=5 nodelay;
    }

    location /admin/ {

        # Apply rate limiting based on the zone defined above
        limit_req zone=admin burst=5 nodelay;

        # set client body size to 10M
        # this has to be set in the container webserver (here),
        # as well as in the proxy
        client_max_body_size 10M;

        proxy_pass http://mapsurvey/admin/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

    }

    location /api/ {

        # Apply rate limiting based on the zone defined above
        limit_req zone=api burst=5 nodelay;

        proxy_pass http://mapsurvey/api/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /opt/mapsurvey/collector/app_staticfiles/;
    }
}
